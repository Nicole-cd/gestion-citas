{% load static %}

{% load static %}
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear cuenta · Agenda</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
</head>

<body class="d-flex align-items-center py-5" style="min-height: 100vh; background-color: #f3f1e8;">

    <div class="container" style="max-width:460px;">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <div class="border-bottom border-dark border-2 pb-3 mb-4">
                    <small class="text-warning text-uppercase d-block" 
                           style="letter-spacing:.1em;font-size:.7rem;">Citas para freelancers</small>
                    <h1 class="h3 mb-0">Crear cuenta</h1>
                </div>

                {% if messages %}
                    {% for message in messages %}
                    <div class="alert alert-{{ message.tags|default:'danger' }} py-2">{{ message }}</div>
                    {% endfor %}
                {% endif %}

                <form method="post" action="{% url 'registro' %}">
                    {% csrf_token %}
                    
                    <div class="mb-3">
                        <label for="id_nombre" class="form-label fw-semibold small">Nombre completo</label>
                        <input type="text" class="form-control" id="id_nombre" name="nombre" maxlength="30"
                            placeholder="Ej. Nicole Carrión" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_correo" class="form-label fw-semibold small">Correo electrónico</label>
                        <input type="email" class="form-control" id="id_correo" name="correo" maxlength="30"
                            placeholder="Nicole@gmail.com" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_password" class="form-label fw-semibold small">Contraseña</label>
                        <input type="password" class="form-control" id="id_password" name="password" maxlength="20"
                            placeholder="Mínimo 6 caracteres" required minlength="6">
                    </div>
                    
                    <div class="mb-3">
                        <label for="id_rol" class="form-label fw-semibold small">Rol</label>
                        <select class="form-select" id="id_rol" name="rol" onchange="segunDisponibilidad()" required>
                            <option value="" disabled selected>Selecciona un rol</option>
                            <option value="cliente">Cliente</option>
                            <option value="freelancer">Freelancer</option>
                            <option value="administrador">Administrador</option>
                        </select>
                    </div>

                    <div id="bloque-disponibilidad" style="display:none;">
                        <div class="mb-3">
                            <label for="id_categoria" class="form-label fw-semibold small">Categoría / área de oficio</label>
                            <input type="text" class="form-control" id="id_categoria" name="categoria" maxlength="100"
                                placeholder="Ej. Arte, Peluqueria...">
                        </div>
                        <div class="mb-4">
                            <label class="form-label fw-semibold small">Disponibilidad semanal</label>
                            
                            <select class="form-select" name="disponibilidad">
                                <option value="lv_9_17">Lunes a viernes, 9:00am – 5:00pm</option>
                                <option value="lv_8_16">Lunes a viernes, 8:00am – 4:00pm</option>
                                <option value="personalizado">Configurar después</option>
                            </select>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100">
                        <i class="bi bi-person-plus me-1"></i> Crear cuenta
                    </button>
                </form>

                <p class="text-center text-secondary small mt-4 mb-0">
                    ¿Ya tienes cuenta? <a href="{% url 'login' %}">Iniciar sesión</a>
                </p>
            </div>
        </div>
    </div>

    <script>
        function segunDisponibilidad() {
            var rol = document.getElementById('id_rol').value;
            var bloque = document.getElementById('bloque-disponibilidad');
            if (rol === 'freelancer') {
                bloque.style.display = 'block';
            } else {
                bloque.style.display = 'none';
            }
        }

        // Ejecutar al cargar la página
        document.addEventListener('DOMContentLoaded', function() {
            toggleDisponibilidad();
        });
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
        crossorigin="anonymous"></script>
</body>

</html>

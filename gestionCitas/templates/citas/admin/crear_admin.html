{% extends "citas/base.html" %}
{% load static %}

{% block title %}Crear Administrador{% endblock %}

{% block content %}
<div class="mb-4">
    <small class="text-warning text-uppercase fw-semibold">Administración</small>
    <h1 class="mb-1">Crear Administrador</h1>
</div>

<div class="card" style="max-width:500px;">
    <div class="card-body">  
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label">Nombre completo</label>
                <input type="text" name="nombre" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Correo</label>
                <input type="email" name="correo" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" name="password" class="form-control" required minlength="6">
            </div>
            <button type="submit" class="btn btn-primary w-100">
                <i class="bi bi-person-plus me-1"></i> Crear Administrador
            </button>
        </form>
        
        <a href="{% url 'admin_dashboard' %}" class="btn btn-outline-secondary w-100 mt-2">
            Volver al panel
        </a>
    </div>
</div>
{% endblock %}
